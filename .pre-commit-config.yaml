repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
    -   id: ruff
        args: [ --fix ]
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/agent/test_graceful_stop_restart.py tests/agent/test_lifecycle_audit.py
        language: system
        pass_filenames: false
        always_run: true
